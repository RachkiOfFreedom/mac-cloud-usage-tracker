name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body || '', '@claude') &&
        contains('["OWNER","MEMBER","COLLABORATOR"]', github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body || '', '@claude') &&
        contains('["OWNER","MEMBER","COLLABORATOR"]', github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # Required to resolve review conversation threads
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@edd85d61533cbba7b57ed0ca4af1750b1fdfd3c4 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Required for Claude to read CI results on PRs
          additional_permissions: |
            actions: read
